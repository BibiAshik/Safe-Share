<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SafeShare</title>
    <link rel="icon" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/mobile.css">
</head>
<body>
    <div class="landing-page">
        <div class="modal" style="position:relative;transform:none">
            <div class="modal-header">
                <h2>Set New Password</h2>
            </div>
            <div class="modal-alert" id="resetAlert"></div>
            <form id="resetPasswordForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" class="form-control" id="newPassword" minlength="6" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <input type="password" class="form-control" id="confirmPassword" minlength="6" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:8px">Update Password</button>
            </form>
            <a class="btn btn-secondary btn-lg hidden" id="loginAfterReset" href="/index.html" style="width:100%;margin-top:12px">Go to Login</a>
        </div>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/reset-password.js"></script>
</body>
</html>
